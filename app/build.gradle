plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.alexis900.neoheadsup'
    compileSdk 34

    defaultConfig {
        applicationId 'io.alexis900.neoheadsup'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'io.alexis900.neoheadsup.WalkingTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    androidTestCompileOnly 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
}
